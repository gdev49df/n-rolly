<div id="boot" aria-hidden="true"><div class="bt-glow"></div><div class="bt-slot" id="btr"></div><div class="bt-sub">Рулетка юзернеймов</div>
<div class="bt-bar"><i id="btb"></i></div><div class="bt-note">Загрузка…</div></div>
<style>
#boot{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:24px;background:radial-gradient(80% 40% at 50% 0,#26262c 0,transparent 70%),#0b0b0e;color:#f4f4f7;font-family:'Unbounded',system-ui,sans-serif;transition:opacity .6s ease,transform .6s ease,filter .6s ease}
#boot.out{opacity:0;transform:scale(1.04);filter:blur(5px);pointer-events:none}
.bt-glow{position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.14),transparent 65%);animation:btg 2.6s ease-in-out infinite}
.bt-slot{position:relative;display:flex;gap:6px;padding:12px;border-radius:26px;background:linear-gradient(160deg,#2c2c33,#16161b);border:1px solid rgba(255,255,255,.2);box-shadow:0 14px 40px rgba(0,0,0,.6),0 0 40px rgba(255,255,255,.08);animation:btl .7s cubic-bezier(.3,.9,.3,1) both}
.bt-slot::after{content:"";position:absolute;left:8px;right:8px;top:50%;height:2px;margin-top:-1px;border-radius:2px;background:rgba(255,255,255,.12);pointer-events:none}
.bt-slot b{width:42px;height:66px;display:grid;place-items:center;overflow:hidden;border-radius:12px;background:#0e0e12;border:1px solid rgba(255,255,255,.1);box-shadow:inset 0 8px 14px -8px #000,inset 0 -8px 14px -8px #000}
.bt-slot b span{font:800 32px 'Unbounded',system-ui,sans-serif;color:#8c8c97;font-style:normal;display:block}
.bt-slot b.sp span{animation:btv .11s linear infinite;filter:blur(1.3px)}
.bt-slot b.lk{border-color:rgba(255,255,255,.35);box-shadow:inset 0 8px 14px -8px #000,inset 0 -8px 14px -8px #000,0 0 18px rgba(255,255,255,.16)}
.bt-slot b.lk span{color:#fff;animation:btk .38s cubic-bezier(.3,1.7,.4,1) both}
@keyframes btv{from{transform:translateY(-22%)}to{transform:translateY(22%)}}
@keyframes btk{from{transform:translateY(-45%)}to{transform:none}}
.bt-sub{position:relative;color:#9a9aa5;font:600 12px system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase}
.bt-bar{position:relative;width:min(220px,64vw);height:4px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden}
.bt-bar i{display:block;height:100%;width:6%;border-radius:99px;background:linear-gradient(90deg,#8c8c97,#fff);transition:width .4s ease;position:relative;overflow:hidden}
.bt-bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);transform:translateX(-100%);animation:btsh 1.2s linear infinite}
.bt-note{position:relative;color:#7c7c88;font:600 12px system-ui,sans-serif;min-height:16px}
@keyframes btl{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes btp2{50%{transform:scale(1.06);box-shadow:0 14px 40px rgba(0,0,0,.6),0 0 60px rgba(255,255,255,.18)}}
@keyframes btg{50%{transform:scale(1.15);opacity:.6}}
@keyframes btsh{to{transform:translateX(100%)}}
@media (prefers-reduced-motion:reduce){#boot,#boot *{animation:none!important;transition:opacity .2s!important}}
</style>
<script>
(function(){
  var T0=Date.now(),W='@ROLLY',el=document.getElementById('btr'),bar=document.getElementById('btb'),boot=document.getElementById('boot'),seen=0,done=0;
  try{seen=sessionStorage.getItem('nrboot')==='1'}catch(e){}
  var nav=0;try{nav=sessionStorage.getItem('nr_nav')==='1';sessionStorage.removeItem('nr_nav')}catch(e){}
  if(nav){boot.style.display='none';document.documentElement.className+=' navin'}
  var MIN=seen?450:1900,rm=window.matchMedia&&matchMedia('(prefers-reduced-motion:reduce)').matches;
  var pool='ABCDEFGHJKLMNPRSTUVWXYZ0123456789@#$%',cells=[];
  function lock(c,i){c.firstChild.textContent=W[i];c.className='lk'}
  for(var i=0;i<W.length;i++){var c=document.createElement('b'),sp=document.createElement('span');c.appendChild(sp);sp.textContent=rm?W[i]:pool[Math.floor(Math.random()*pool.length)];c.className=rm?'lk':'sp';cells.push(c);el.appendChild(c)}
  // барабаны крутятся и по очереди останавливаются на слове «@ROLLY»
  var iv=rm?0:setInterval(function(){var t=Date.now()-T0;cells.forEach(function(c,i){if(c.className==='lk')return;
    if(t>(seen?200+i*50:500+i*230))lock(c,i);else c.firstChild.textContent=pool[Math.floor(Math.random()*pool.length)]})},60);
  var pv=setInterval(function(){var p=Math.min(90,6+(Date.now()-T0)/MIN*70);bar.style.width=p+'%'},120);
  function finish(force){
    if(done)return;done=1;
    var wait=force?0:Math.max(0,MIN-(Date.now()-T0));
    // буквы продолжают крутиться до конца; перед закрытием все «защёлкиваются» в слово
    setTimeout(function(){clearInterval(iv);clearInterval(pv);bar.style.width='100%';cells.forEach(function(c,i){if(c.className!=='lk')lock(c,i)});
      setTimeout(function(){boot.className='out';try{sessionStorage.setItem('nrboot','1')}catch(e){}setTimeout(function(){boot.remove()},650)},force?0:seen?120:450)},wait);
  }
  window.bootDone=function(force){
    if(force)return finish(true);
    var go=function(){finish(false)};
    if(document.fonts&&document.fonts.ready){var to=setTimeout(go,1500);document.fonts.ready.then(function(){clearTimeout(to);go()})}else go();
  };
  addEventListener('error',function(){setTimeout(function(){window.bootDone(true)},300)});
  setTimeout(function(){window.bootDone(true)},8000);   // запасной выход: загрузочный экран не должен закрыть игру навсегда
})();
</script>
